name: Build

# Build production images after CI passes on main, push them to GHCR and deploy them
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: ['main']

permissions: {}

jobs:
  build:
    # workflow_run also fires for pull requests whose head branch is called main
    if: {% raw %}${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}{% endraw %}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - name: django
            dockerfile: compose/production/django/Dockerfile
          - name: postgres
            dockerfile: compose/production/postgres/Dockerfile
          {%- if cookiecutter.cloud_provider == 'None' %}
          - name: nginx
            dockerfile: compose/production/nginx/Dockerfile
          {%- endif %}
          {%- if cookiecutter.cloud_provider == 'AWS' %}
          - name: awscli
            dockerfile: compose/production/aws/Dockerfile
          {%- endif %}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7
        with:
          ref: {% raw %}${{ github.event.workflow_run.head_sha }}{% endraw %}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: {% raw %}${{ github.actor }}{% endraw %}
          password: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}

      # GHCR image names must be lowercase, GitHub repository names don't have to be
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-{% raw %}${{ matrix.image.name }}{% endraw %}" >> "$GITHUB_OUTPUT"

      # Loaded locally rather than pushed, so the django image can be checked first
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: {% raw %}${{ matrix.image.dockerfile }}{% endraw %}
          load: true
          provenance: false
          # Links the package to this repository, so it inherits the repository's access and its workflows can manage it
          labels: org.opencontainers.image.source={% raw %}${{ github.server_url }}/${{ github.repository }}{% endraw %}
          tags: |
            {% raw %}${{ steps.image.outputs.name }}:sha-${{ github.event.workflow_run.head_sha }}{% endraw %}
            {% raw %}${{ steps.image.outputs.name }}{% endraw %}:latest
          cache-from: type=registry,ref={% raw %}${{ steps.image.outputs.name }}{% endraw %}:buildcache
          cache-to: type=registry,ref={% raw %}${{ steps.image.outputs.name }}{% endraw %}:buildcache,mode=max

      # The default fail level ignores warnings, so a check without the flag never fails.
      # Dummy values stand in for secrets: the check reads settings, it doesn't connect anywhere.
      - name: Check production settings
        if: {% raw %}${{ matrix.image.name == 'django' }}{% endraw %}
        env:
          IMAGE: {% raw %}${{ steps.image.outputs.name }}:sha-${{ github.event.workflow_run.head_sha }}{% endraw %}
        run: |
          docker run --rm --entrypoint python \
            -e DJANGO_SETTINGS_MODULE=config.settings.production \
            -e DJANGO_SECRET_KEY="$(openssl rand -base64 64)" \
            -e DJANGO_ADMIN_URL=admin-check/ \
            -e DATABASE_URL=postgres://check:check@localhost:5432/check \
            {%- if cookiecutter.cloud_provider == 'AWS' %}
            -e DJANGO_AWS_ACCESS_KEY_ID=check -e DJANGO_AWS_SECRET_ACCESS_KEY=check -e DJANGO_AWS_STORAGE_BUCKET_NAME=check \
            {%- elif cookiecutter.cloud_provider == 'GCP' %}
            -e DJANGO_GCP_STORAGE_BUCKET_NAME=check \
            {%- elif cookiecutter.cloud_provider == 'Azure' %}
            -e DJANGO_AZURE_ACCOUNT_KEY=check -e DJANGO_AZURE_ACCOUNT_NAME=check -e DJANGO_AZURE_CONTAINER_NAME=check \
            {%- endif %}
            {%- if cookiecutter.mail_service == 'Mailgun' %}
            -e MAILGUN_API_KEY=check -e MAILGUN_DOMAIN=check \
            {%- elif cookiecutter.mail_service == 'Mailjet' %}
            -e MAILJET_API_KEY=check -e MAILJET_SECRET_KEY=check \
            {%- elif cookiecutter.mail_service == 'Mandrill' %}
            -e MANDRILL_API_KEY=check \
            {%- elif cookiecutter.mail_service == 'Postmark' %}
            -e POSTMARK_SERVER_TOKEN=check \
            {%- elif cookiecutter.mail_service == 'Sendgrid' %}
            -e SENDGRID_API_KEY=check \
            {%- elif cookiecutter.mail_service == 'Brevo' %}
            -e BREVO_API_KEY=check \
            {%- elif cookiecutter.mail_service == 'SparkPost' %}
            -e SPARKPOST_API_KEY=check \
            {%- endif %}
            {%- if cookiecutter.use_sentry == 'y' %}
            -e SENTRY_DSN=https://check@example.com/1 \
            {%- endif %}
            "$IMAGE" manage.py check --deploy --fail-level WARNING

      - name: Push
        run: docker push --all-tags {% raw %}${{ steps.image.outputs.name }}{% endraw %}

  deploy:
    needs: build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      tag: sha-{% raw %}${{ github.event.workflow_run.head_sha }}{% endraw %}
    secrets: inherit

  cleanup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Package names
        id: packages
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          echo "names=${repo}-django ${repo}-postgres{% if cookiecutter.cloud_provider == 'None' %} ${repo}-nginx{% endif %}{% if cookiecutter.cloud_provider == 'AWS' %} ${repo}-awscli{% endif %}" >> "$GITHUB_OUTPUT"

      # Keeps the newest tagged versions for rollbacks (one of them is buildcache) and deletes the rest,
      # untagged ones included
      - name: Delete old images
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: {% raw %}${{ github.event.repository.owner.type == 'Organization' && github.repository_owner || 'user' }}{% endraw %}
          token: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}
          image-names: {% raw %}${{ steps.packages.outputs.names }}{% endraw %}
          tag-selection: both
          keep-n-most-recent: 10
          cut-off: 1h
