{%- macro image(name, ghcr_name=none) -%}
{%- if cookiecutter.deploy_ssh == 'y' -%}
${IMAGE_PREFIX:-{{ cookiecutter.project_slug }}}-{{ ghcr_name or name }}:${IMAGE_TAG:-latest}
{%- else -%}
{{ cookiecutter.project_slug }}_production_{{ name }}
{%- endif -%}
{%- endmacro -%}
volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  {%- if cookiecutter.postgres_backup == 'WAL-G' %}
  production_postgres_walg: {}
  {%- endif %}
  {%- if cookiecutter.use_external_traefik == 'n' %}
  production_traefik: {}
  {%- endif %}
  {%- if cookiecutter.cloud_provider == 'None' %}
  production_django_media: {}
  {%- endif %}
  {% if cookiecutter.use_celery == 'y' %}
  production_redis_data: {}
  {% endif %}


services:
  django:{% if cookiecutter.use_celery == 'y' %} &django{% endif %}
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: {{ image('django') }}
    {%- if cookiecutter.cloud_provider == 'None' %}
    volumes:
      - production_django_media:/app/{{ cookiecutter.project_slug }}/media
    {%- endif %}
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    command: /start
    {%- if cookiecutter.deploy_ssh == 'y' %}
    # docker rollout waits for this before it stops the old container. It also fails once /tmp/drain
    # exists, so Traefik stops sending requests to a container that is about to stop.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, urllib.request as r; os.path.exists('/tmp/drain') and sys.exit(1); r.urlopen(r.Request('http://127.0.0.1:5000/healthz/', headers={'Host': '{{ cookiecutter.domain_name }}', 'X-Forwarded-Proto': 'https'}), timeout=5)"
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 30s
    {%- endif %}
    {%- if cookiecutter.use_external_traefik == 'y' %}
    networks:
      - default
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.{{ cookiecutter.project_slug }}.rule=Host(`{{ cookiecutter.domain_name }}`)
      - traefik.http.routers.{{ cookiecutter.project_slug }}.entrypoints=websecure
      - traefik.http.routers.{{ cookiecutter.project_slug }}.tls.certresolver=le
      - traefik.http.routers.{{ cookiecutter.project_slug }}.middlewares={{ cookiecutter.project_slug }}-csrf,{{ cookiecutter.project_slug }}-no-server,{{ cookiecutter.project_slug }}-retry
      - traefik.http.routers.{{ cookiecutter.project_slug }}.service={{ cookiecutter.project_slug }}-django
      - traefik.http.services.{{ cookiecutter.project_slug }}-django.loadbalancer.server.port=5000
      # https://docs.djangoproject.com/en/dev/ref/csrf/#ajax
      - traefik.http.middlewares.{{ cookiecutter.project_slug }}-csrf.headers.hostsProxyHeaders=X-CSRFToken
      # An empty value removes the header, so the response doesn't reveal the server software
      - traefik.http.middlewares.{{ cookiecutter.project_slug }}-no-server.headers.customResponseHeaders.Server=
      # Resends a request only when no container accepted it, e.g. one stopping during a rollout
      - traefik.http.middlewares.{{ cookiecutter.project_slug }}-retry.retry.attempts=3
      - traefik.http.middlewares.{{ cookiecutter.project_slug }}-retry.retry.initialInterval=100ms
      {%- if cookiecutter.deploy_ssh == 'y' %}
      # Longer than interval x retries above, so the container is unhealthy before it's stopped
      - docker-rollout.pre-stop-hook=touch /tmp/drain && sleep 15
      {%- endif %}
      {%- if cookiecutter.domain_name.count('.') == 1 %}
      - traefik.http.routers.{{ cookiecutter.project_slug }}-www.rule=Host(`www.{{ cookiecutter.domain_name }}`)
      - traefik.http.routers.{{ cookiecutter.project_slug }}-www.entrypoints=websecure
      - traefik.http.routers.{{ cookiecutter.project_slug }}-www.tls.certresolver=le
      - traefik.http.routers.{{ cookiecutter.project_slug }}-www.middlewares={{ cookiecutter.project_slug }}-www-redirect
      - traefik.http.routers.{{ cookiecutter.project_slug }}-www.service={{ cookiecutter.project_slug }}-django
      - 'traefik.http.middlewares.{{ cookiecutter.project_slug }}-www-redirect.redirectregex.regex=^https://www\.{{ cookiecutter.domain_name | replace('.', '\.') }}(:[0-9]+)?/(.*)'
      - 'traefik.http.middlewares.{{ cookiecutter.project_slug }}-www-redirect.redirectregex.replacement=https://{{ cookiecutter.domain_name }}$${1}/$${2}'
      - traefik.http.middlewares.{{ cookiecutter.project_slug }}-www-redirect.redirectregex.permanent=true
      {%- endif %}
    {%- endif %}

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: {{ image('postgres') }}
    {%- if cookiecutter.postgres_backup == 'WAL-G' %}
    # Ships every finished WAL segment to WAL-G storage, at least once a minute
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=60
    {%- endif %}
    volumes:
      {%- if cookiecutter.postgresql_version|int >= 18 %}
      - production_postgres_data:/var/lib/postgresql/{{ cookiecutter.postgresql_version }}/docker
      {%- else %}
      - production_postgres_data:/var/lib/postgresql/data
      {%- endif %}
      - production_postgres_data_backups:/backups
      {%- if cookiecutter.postgres_backup == 'WAL-G' %}
      - production_postgres_walg:/walg
      {%- endif %}
    env_file:
      - ./.envs/.production/.postgres
      {%- if cookiecutter.postgres_backup == 'WAL-G' %}
      - path: ./.envs/.production/.walg
        required: false
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

  # Takes the base backups; WAL is archived by postgres itself
  postgres-backup:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: {{ image('postgres') }}
    user: postgres
    command: walg-backup-scheduler
    volumes:
      {%- if cookiecutter.postgresql_version|int >= 18 %}
      - production_postgres_data:/var/lib/postgresql/{{ cookiecutter.postgresql_version }}/docker
      {%- else %}
      - production_postgres_data:/var/lib/postgresql/data
      {%- endif %}
      - production_postgres_walg:/walg
    env_file:
      - ./.envs/.production/.postgres
      - path: ./.envs/.production/.walg
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      {%- endif %}
  {%- if cookiecutter.use_external_traefik == 'n' %}

  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
    image: {{ cookiecutter.project_slug }}_production_traefik
    depends_on:
      - django
    volumes:
      - production_traefik:/etc/traefik/acme
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
      {%- if cookiecutter.use_celery == 'y' %}
      - '0.0.0.0:5555:5555'
      {%- endif %}
  {%- endif %}

  redis:
    image: docker.io/redis:7.2
    {% if cookiecutter.use_celery == 'y' %}
    volumes:
      - production_redis_data:/data
    {% endif %}


  {%- if cookiecutter.use_celery == 'y' %}

  celeryworker:
    <<: *django
    image: {{ image('celeryworker', 'django') }}
    command: /start-celeryworker
    {%- if cookiecutter.deploy_ssh == 'y' %}
    healthcheck:
      disable: true
    {%- endif %}
    {%- if cookiecutter.use_external_traefik == 'y' %}
    networks:
      - default
    labels: []
    {%- endif %}

  celerybeat:
    <<: *django
    image: {{ image('celerybeat', 'django') }}
    command: /start-celerybeat
    {%- if cookiecutter.deploy_ssh == 'y' %}
    healthcheck:
      disable: true
    {%- endif %}
    {%- if cookiecutter.use_external_traefik == 'y' %}
    networks:
      - default
    labels: []
    {%- endif %}

  flower:
    <<: *django
    image: {{ image('flower', 'django') }}
    command: /start-flower
    {%- if cookiecutter.deploy_ssh == 'y' %}
    healthcheck:
      disable: true
    {%- endif %}
    {%- if cookiecutter.use_external_traefik == 'y' %}
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.{{ cookiecutter.project_slug }}-flower.rule=Host(`flower.{{ cookiecutter.domain_name }}`)
      - traefik.http.routers.{{ cookiecutter.project_slug }}-flower.entrypoints=websecure
      - traefik.http.routers.{{ cookiecutter.project_slug }}-flower.tls.certresolver=le
      - traefik.http.routers.{{ cookiecutter.project_slug }}-flower.middlewares={{ cookiecutter.project_slug }}-no-server
      - traefik.http.routers.{{ cookiecutter.project_slug }}-flower.service={{ cookiecutter.project_slug }}-flower
      - traefik.http.services.{{ cookiecutter.project_slug }}-flower.loadbalancer.server.port=5555
    {%- endif %}
  {%- endif %}
  {%- if cookiecutter.cloud_provider == 'AWS' %}

  awscli:
    build:
      context: .
      dockerfile: ./compose/production/aws/Dockerfile
    {%- if cookiecutter.deploy_ssh == 'y' %}
    image: {{ image('awscli') }}
    {%- endif %}
    env_file:
      - ./.envs/.production/.django
    volumes:
      - production_postgres_data_backups:/backups:z
  {%- endif %}
  {%- if cookiecutter.cloud_provider == 'None' %}

  nginx:
    build:
      context: .
      dockerfile: ./compose/production/nginx/Dockerfile
    image: {{ image('nginx') }}
    depends_on:
      - django
    volumes:
      - production_django_media:/usr/share/nginx/media:ro
    {%- if cookiecutter.use_external_traefik == 'y' %}
    networks:
      - default
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.{{ cookiecutter.project_slug }}-media.rule=Host(`{{ cookiecutter.domain_name }}`) && PathPrefix(`/media/`)
      - traefik.http.routers.{{ cookiecutter.project_slug }}-media.entrypoints=websecure
      - traefik.http.routers.{{ cookiecutter.project_slug }}-media.tls.certresolver=le
      # Explicit, so /media/ stays on nginx even if the django rule grows longer
      - traefik.http.routers.{{ cookiecutter.project_slug }}-media.priority=100
      - traefik.http.routers.{{ cookiecutter.project_slug }}-media.middlewares={{ cookiecutter.project_slug }}-nosniff,{{ cookiecutter.project_slug }}-no-server
      - traefik.http.routers.{{ cookiecutter.project_slug }}-media.service={{ cookiecutter.project_slug }}-media
      - traefik.http.services.{{ cookiecutter.project_slug }}-media.loadbalancer.server.port=80
      - traefik.http.middlewares.{{ cookiecutter.project_slug }}-nosniff.headers.contentTypeNosniff=true
    {%- endif %}
  {%- endif %}
{% if cookiecutter.use_external_traefik == 'y' %}
networks:
  traefik-public:
    external: true
{% endif -%}
